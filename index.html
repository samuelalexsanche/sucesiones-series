<script>
const R = String.raw;

const GEO_HTML = R`<div class="explorer" id="geo">
  <div class="ctrl"><label for="geo-a">\(a\)</label><input type="range" id="geo-a" min="-4" max="4" step="0.5" value="1"><output class="readout" id="geo-a-out" for="geo-a">1</output></div>
  <div class="ctrl"><label for="geo-r">\(r\)</label><input type="range" id="geo-r" min="-1.5" max="1.5" step="0.05" value="0.5"><output class="readout" id="geo-r-out" for="geo-r">0.5</output></div>
  <div class="geo-result" id="geo-result" aria-live="polite"></div>
  <div class="chart-wrap"><svg id="geo-svg" viewBox="0 0 640 250" role="img" aria-label="Términos y sumas parciales de la serie geométrica para los valores elegidos"></svg></div>
  <div class="legend"><span><i class="sw sw-bar"></i>Términos \(a r^n\)</span><span><i class="sw sw-sum"></i>Sumas parciales \(S_n\)</span><span><i class="sw sw-lim"></i>Suma \(\frac{a}{1-r}\) cuando converge</span></div>
</div>`;

const LEVELS = [
{
  short: "Sucesiones",
  title: "Qué es una sucesión",
  goal: "Leer la notación, calcular términos y encontrar la fórmula de una lista de números.",
  lesson: R`
<p>Una <b>sucesión</b> es una lista infinita de números en un orden fijo: \(a_1, a_2, a_3, \dots\). El subíndice \(n\) es la posición y \(a_n\) es el número que está en esa posición.</p>
<div class="formula">\[ a_n = 2n + 1 \quad\Longrightarrow\quad 3,\ 5,\ 7,\ 9,\ \dots \]</div>
<h3>Dos formas de definirla</h3>
<p><b>Fórmula explícita.</b> Te da cualquier término directo. Para el término 10 de \(a_n = 2n+1\) sustituyes \(n = 10\): \(a_{10} = 21\).</p>
<p><b>Fórmula recursiva.</b> Cada término se calcula con el anterior, así que necesitas un punto de partida.</p>
<div class="formula">\[ a_1 = 2,\qquad a_{n+1} = 3a_n \quad\Longrightarrow\quad 2,\ 6,\ 18,\ 54,\ \dots \]</div>
<h3>Encontrar la fórmula a partir de los términos</h3>
<p>Pregúntate qué relación tiene cada número con su posición.</p>
<div class="example"><span class="tag">Ejemplos</span>
<ul>
<li>\(1, 4, 9, 16, \dots\) son los cuadrados de la posición: \(a_n = n^2\).</li>
<li>\(\tfrac12, \tfrac13, \tfrac14, \dots\): el denominador va una posición adelante: \(a_n = \dfrac{1}{n+1}\).</li>
<li>\(1, -1, 1, -1, \dots\): el signo se alterna. Con \(n\) empezando en 1, \(a_n = (-1)^{n+1}\).</li>
</ul></div>
<p class="tip">Revisa si la sucesión empieza en \(n = 1\) o en \(n = 0\). La misma lista puede tener fórmulas distintas según dónde empiece el índice.</p>`,
  quiz: [
    { id: "q1a", type: "num", q: R`Si \(a_n = 3n - 1\), ¿cuánto vale \(a_4\)?`, answer: 11, display: "11",
      explain: R`Sustituyes \(n = 4\): \(a_4 = 3(4) - 1 = 11\).` },
    { id: "q1b", type: "mc", q: R`¿Qué fórmula genera \(2, 4, 8, 16, \dots\)? (empieza en \(n = 1\))`,
      options: [R`\(a_n = 2n\)`, R`\(a_n = 2^n\)`, R`\(a_n = n^2\)`, R`\(a_n = n + 2\)`], answer: 1,
      explain: R`Cada término es el doble del anterior: \(2^1, 2^2, 2^3, 2^4\). La fórmula \(2n\) daría \(2, 4, 6, 8\).` },
    { id: "q1c", type: "num", q: R`Si \(a_1 = 5\) y \(a_{n+1} = a_n - 2\), ¿cuánto vale \(a_4\)?`, answer: -1, display: "-1",
      explain: R`Vas uno por uno: \(a_1 = 5,\ a_2 = 3,\ a_3 = 1,\ a_4 = -1\).` },
    { id: "q1d", type: "mc", q: R`¿Qué fórmula da \(1, -1, 1, -1, \dots\) si \(n\) empieza en 1?`,
      options: [R`\((-1)^n\)`, R`\((-1)^{n+1}\)`, R`\(1 - n\)`, R`\(\dfrac{1}{n}\)`], answer: 1,
      explain: R`Con \(n = 1\): \((-1)^{2} = 1\). Con \(n = 2\): \((-1)^{3} = -1\). La opción \((-1)^n\) empieza en \(-1\).` },
    { id: "q1e", type: "num", q: R`Si \(a_n = \dfrac{n}{n+1}\), ¿cuánto vale \(a_9\)?`, answer: 0.9, display: "9/10",
      explain: R`\(a_9 = \dfrac{9}{10} = 0.9\).` }
  ],
  problems: [
    { id: "p1a", q: R`Si \(a_1 = 1\) y \(a_{n+1} = 2a_n + 1\), encuentra \(a_5\).`, answer: 31, display: "31",
      hint: R`Calcula los términos uno por uno: el siguiente es el doble del anterior más uno.`,
      solution: R`<ol><li>\(a_1 = 1\)</li><li>\(a_2 = 2(1) + 1 = 3\)</li><li>\(a_3 = 2(3) + 1 = 7\)</li><li>\(a_4 = 2(7) + 1 = 15\)</li><li>\(a_5 = 2(15) + 1 = 31\)</li></ol><p>Fíjate en el patrón: \(1, 3, 7, 15, 31\) es \(2^n - 1\). Encontrar la fórmula explícita de una recursiva es muy útil.</p>` },
    { id: "p1b", q: R`¿Cuál es el sexto término de \(\tfrac12, \tfrac14, \tfrac16, \tfrac18, \dots\)?`, answer: 1/12, display: "1/12",
      hint: R`Mira los denominadores: \(2, 4, 6, 8\). ¿Qué relación tienen con la posición?`,
      solution: R`<ol><li>Los denominadores son \(2n\), así que \(a_n = \dfrac{1}{2n}\).</li><li>\(a_6 = \dfrac{1}{12}\).</li></ol>` },
    { id: "p1c", q: R`Para \(a_n = n^2 - 5n\) con \(n \ge 1\), ¿en qué posición \(n\) vale 0 la sucesión?`, answer: 5, display: "5",
      hint: R`Iguala a cero y factoriza.`,
      solution: R`<ol><li>\(n^2 - 5n = 0\)</li><li>\(n(n - 5) = 0\), así que \(n = 0\) o \(n = 5\).</li><li>Como \(n \ge 1\), la respuesta es \(n = 5\).</li></ol>` }
  ]
},
{
  short: "Límites",
  title: "Hacia dónde va una sucesión",
  goal: "Calcular el límite de una sucesión y decidir si converge o diverge.",
  lesson: R`
<p>Lo que más importa de una sucesión es hacia dónde va cuando \(n\) se hace enorme. Eso es su <b>límite</b>:</p>
<div class="formula">\[ \lim_{n\to\infty} a_n = L \]</div>
<p>Si existe un número \(L\), la sucesión <b>converge</b> a \(L\). Si crece sin parar o salta sin decidirse, <b>diverge</b>.</p>
<h3>Límites que conviene saber de memoria</h3>
<ul>
<li>\(\dfrac{1}{n} \to 0\), y en general \(\dfrac{1}{n^p} \to 0\) si \(p > 0\).</li>
<li>\(r^n \to 0\) si \(|r| < 1\). Por ejemplo, \((0.5)^n\).</li>
<li>\(r^n \to \infty\) si \(r > 1\).</li>
<li>Una constante se queda igual: \(c \to c\).</li>
</ul>
<h3>Cocientes de polinomios</h3>
<p>Divide arriba y abajo entre la potencia más alta de \(n\) del denominador. Todo lo que quede como un número entre \(n^k\) se va a cero.</p>
<div class="example"><span class="tag">Ejemplo</span>\[ \lim_{n\to\infty}\frac{3n^2+1}{n^2+5} = \lim_{n\to\infty}\frac{3+\frac{1}{n^2}}{1+\frac{5}{n^2}} = \frac{3+0}{1+0} = 3 \]</div>
<p>De ahí sale un atajo:</p>
<ul>
<li>Mismo grado arriba y abajo: el límite es el cociente de los coeficientes principales.</li>
<li>Grado de arriba menor: el límite es 0.</li>
<li>Grado de arriba mayor: diverge.</li>
</ul>
<h3>Cuando oscila</h3>
<p>\((-1)^n\) salta entre \(-1\) y \(1\) para siempre, así que diverge. En cambio \(\dfrac{(-1)^n}{n}\) converge a 0: el signo salta, pero el tamaño se hace cada vez más chico.</p>
<p class="tip">Una sucesión puede tener términos negativos, alternar o crecer al principio. Lo único que cuenta para el límite es qué pasa cuando \(n\) es muy grande.</p>`,
  quiz: [

{
  short: "Aritméticas y geométricas",
  title: "Aritméticas y geométricas",
  goal: "Reconocer los dos tipos clásicos, escribir su fórmula y sumar una aritmética.",
  lesson: R`
<p>Hay dos tipos de sucesiones que vas a usar todo el tiempo.</p>
<div class="two wide">
  <div class="kind"><h3>Aritmética</h3><p>Sumas siempre lo mismo: la <b>diferencia</b> \(d\).</p>\[ a_n = a_1 + (n-1)\,d \]<p class="muted">\(5, 9, 13, 17, \dots\) tiene \(d = 4\).</p></div>
  <div class="kind"><h3>Geométrica</h3><p>Multiplicas siempre por lo mismo: la <b>razón</b> \(r\).</p>\[ a_n = a_1\, r^{\,n-1} \]<p class="muted">\(3, 6, 12, 24, \dots\) tiene \(r = 2\).</p></div>
</div>
<p>Para saber cuál es, resta términos seguidos. Si siempre da lo mismo, es aritmética. Si lo que se repite es la división de un término entre el anterior, es geométrica.</p>
<h3>Suma de una aritmética</h3>
<p>Se cuenta que Gauss, de niño, sumó del 1 al 100 en segundos. Juntó el primero con el último (\(1 + 100\)), el segundo con el penúltimo (\(2 + 99\)), y así. Son 50 parejas que suman 101 cada una.</p>
<div class="formula">\[ S_n = \frac{n\,(a_1 + a_n)}{2} \qquad\qquad 1 + 2 + \cdots + 100 = \frac{100 \cdot 101}{2} = 5050 \]</div>
<h3>Cómo se comporta una geométrica</h3>
<p>Todo depende de la razón \(r\):</p>
<div class="tbl"><table>
<thead><tr><th>Razón</th><th>Qué pasa</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td>\(|r| < 1\)</td><td>Se acerca a 0: converge</td><td>\(8, 4, 2, 1, \dots\)</td></tr>
<tr><td>\(r = 1\)</td><td>Se queda constante</td><td>\(5, 5, 5, \dots\)</td></tr>
<tr><td>\(r > 1\)</td><td>Crece sin límite: diverge</td><td>\(3, 6, 12, \dots\)</td></tr>
<tr><td>\(r \le -1\)</td><td>Cambia de signo y no se calma: diverge</td><td>\(1, -2, 4, -8, \dots\)</td></tr>
</tbody></table></div>
<p class="tip">Esta tabla es la base del nivel 5: la serie geométrica converge justo cuando \(|r| < 1\).</p>`,

    { id: "q3b", type: "num", q: R`¿Cuánto es \(1 + 2 + 3 + \cdots + 100\)?`, answer: 5050, display: "5050",
      explain: R`\(\dfrac{100\,(1 + 100)}{2} = 5050\).` },
    { id: "q3c", type: "num", q: R`En \(3, 6, 12, 24, \dots\), ¿cuánto vale \(a_8\)?`, answer: 384, display: "384",
      explain: R`\(a_8 = 3 \cdot 2^{7} = 3 \cdot 128 = 384\).` },
    { id: "q3d", type: "num", q: R`¿Cuál es la razón de \(81, 27, 9, 3, \dots\)?`, answer: 1/3, display: "1/3",
      explain: R`\(\dfrac{27}{81} = \dfrac13\).` },
    { id: "q3e", type: "mc", q: R`¿Qué tipo de sucesión es \(2, -6, 18, -54, \dots\)?`,
      options: [R`Aritmética con \(d = -8\)`, R`Geométrica con \(r = -3\)`, R`Geométrica con \(r = 3\)`, "Ninguna de las dos"], answer: 1,

{
  short: "Series",
  title: "Series y sumas parciales",
  goal: "Entender qué significa sumar infinitos términos y cuándo esa suma da un número.",
  lesson: R`
<p>Una <b>serie</b> es lo que obtienes al sumar todos los términos de una sucesión:</p>
<div class="formula">\[ \sum_{n=1}^{\infty} a_n = a_1 + a_2 + a_3 + \cdots \]</div>
<p>Se lee “la suma de \(a_n\) desde \(n = 1\) hasta infinito”. Debajo de la \(\Sigma\) va dónde empieza el índice; arriba, dónde termina.</p>
<h3>El truco: sumas parciales</h3>
<p>No se pueden sumar infinitos números de golpe. Lo que se hace es sumar poco a poco y ver a qué número se acerca el total:</p>
<div class="formula">\[ S_1 = a_1,\qquad S_2 = a_1 + a_2,\qquad \dots,\qquad S_n = a_1 + a_2 + \cdots + a_n \]</div>
<p>Las sumas parciales forman una <b>nueva sucesión</b>. Si \(S_n\) converge a un número \(S\), decimos que la serie converge y que su suma es \(S\). Si no, la serie diverge.</p>
<div class="example"><span class="tag">Ejemplo</span>
<p>\(\tfrac12 + \tfrac14 + \tfrac18 + \tfrac1{16} + \cdots\)</p>
<p>\(S_1 = 0.5,\ S_2 = 0.75,\ S_3 = 0.875,\ S_4 = 0.9375,\ \dots\) Cada vez agregas la mitad de lo que falta para llegar a 1, así que las sumas parciales se acercan a 1.</p></div>
<figure><svg class="zeno" id="zeno" viewBox="0 0 240 240" role="img" aria-label="Cuadrado de área 1 dividido en mitades sucesivas: un medio, un cuarto, un octavo y así"></svg>
<figcaption>Cada pedazo es la mitad del anterior. Juntos llenan el cuadrado completo, de área 1.</figcaption></figure>
<h3>Series telescópicas</h3>
<p>Algunas series se cancelan solas. Como \(\dfrac{1}{n(n+1)} = \dfrac{1}{n} - \dfrac{1}{n+1}\):</p>
<div class="formula">\[ S_n = \left(1 - \tfrac12\right) + \left(\tfrac12 - \tfrac13\right) + \cdots + \left(\tfrac1n - \tfrac{1}{n+1}\right) = 1 - \frac{1}{n+1} \;\longrightarrow\; 1 \]</div>
<p>Todo lo de en medio se cancela y solo sobreviven el primer pedazo y el último.</p>
<h3>No confundas sucesión con serie</h3>
<p>La sucesión \(\dfrac{1}{2^n}\) tiende a <b>0</b>: cada término se hace chiquito. La serie \(\sum \dfrac{1}{2^n}\) suma <b>1</b>: es el total acumulado. Son dos preguntas distintas.</p>
<p class="tip">Si te dan \(S_n\) y quieres un término, réstale la suma anterior: \(a_n = S_n - S_{n-1}\).</p>`,
  quiz: [
    { id: "q4a", type: "num", q: R`Calcula \(\displaystyle \sum_{n=1}^{4} n^2\).`, answer: 30, display: "30",
      explain: R`\(1 + 4 + 9 + 16 = 30\).` },
    { id: "q4b", type: "num", q: R`Calcula \(\displaystyle \sum_{k=1}^{5} (2k - 1)\).`, answer: 25, display: "25",
      explain: R`\(1 + 3 + 5 + 7 + 9 = 25\). La suma de los primeros \(n\) impares siempre es \(n^2\).` },
    { id: "q4c", type: "num", q: R`¿Cuánto vale \(S_3\) para \(\displaystyle \sum_{n=1}^{\infty} \frac{1}{2^n}\)?`, answer: 0.875, display: "7/8",
      explain: R`\(S_3 = \tfrac12 + \tfrac14 + \tfrac18 = \tfrac78 = 0.875\).` },
    { id: "q4d", type: "mc", q: R`Si las sumas parciales de una serie son \(S_n = 5 - \dfrac{1}{n}\), la serie…`,
      options: ["Converge a 5", "Converge a 0", "Diverge", "Converge a 4"], answer: 0,
      explain: R`\(S_n \to 5 - 0 = 5\). La suma de la serie es el límite de sus sumas parciales.` },
    { id: "q4e", type: "num", q: R`Calcula \(\displaystyle \sum_{n=1}^{\infty} \frac{1}{n(n+1)}\).`, answer: 1, display: "1",
      explain: R`Es telescópica: \(S_n = 1 - \dfrac{1}{n+1} \to 1\).` }
  ],
  problems: [
    { id: "p4a", q: R`Las sumas parciales de una serie son \(S_n = \dfrac{3n}{n+2}\). ¿A qué número converge la serie?`, answer: 3, display: "3",
      hint: R`La suma de la serie es \(\lim S_n\).`,
      solution: R`<ol><li>\(\lim_{n\to\infty} \dfrac{3n}{n+2}\): mismo grado.</li><li>El límite es \(\tfrac31 = 3\).</li></ol>` },
    { id: "p4b", q: R`Con esas mismas sumas parciales \(S_n = \dfrac{3n}{n+2}\), ¿cuánto vale el término \(a_2\)?`, answer: 0.5, display: "1/2",
      hint: R`Usa \(a_2 = S_2 - S_1\).`,
      solution: R`<ol><li>\(S_2 = \dfrac{6}{4} = 1.5\) y \(S_1 = \dfrac{3}{3} = 1\).</li><li>\(a_2 = 1.5 - 1 = 0.5\).</li></ol>` },
    { id: "p4c", q: R`Calcula \(\displaystyle \sum_{n=1}^{\infty} \left(\frac{1}{n} - \frac{1}{n+2}\right)\).`, answer: 1.5, display: "3/2",
      hint: R`Escribe los primeros cinco paréntesis y tacha lo que se cancela. Aquí se cancela con dos lugares de distancia.`,
      solution: R`<ol><li>\(\left(1 - \tfrac13\right) + \left(\tfrac12 - \tfrac14\right) + \left(\tfrac13 - \tfrac15\right) + \left(\tfrac14 - \tfrac16\right) + \cdots\)</li><li>Se cancelan \(\tfrac13, \tfrac14, \tfrac15, \dots\) y sobreviven \(1\) y \(\tfrac12\).</li><li>\(S_n = 1 + \tfrac12 - \tfrac{1}{n+1} - \tfrac{1}{n+2} \to \tfrac32\).</li></ol>` }
  ]
},
{
  short: "Serie geométrica",
  title: "La serie geométrica",
  goal: "Saber cuándo converge una serie geométrica y calcular su suma exacta.",
  lesson: R`
<p>Es la serie más importante del tema, porque es de las pocas cuya suma se puede calcular exacta.</p>
<div class="formula">\[ \sum_{n=0}^{\infty} a\,r^n = a + ar + ar^2 + ar^3 + \cdots \]</div>
<h3>De dónde sale la fórmula</h3>
<p>Escribe la suma parcial, multiplícala por \(r\) y resta. Casi todo se cancela:</p>
<div class="formula">\[ \begin{aligned} S_n &= a + ar + ar^2 + \cdots + ar^{n-1} \\ rS_n &= \phantom{a + {}} ar + ar^2 + \cdots + ar^{n-1} + ar^n \\ S_n - rS_n &= a - ar^n \end{aligned} \qquad\Longrightarrow\qquad S_n = \frac{a\,(1 - r^n)}{1 - r} \]</div>
<p>Si \(|r| < 1\), entonces \(r^n \to 0\) y queda:</p>
<div class="formula">\[ \sum_{n=0}^{\infty} a\,r^n = \frac{a}{1 - r} \qquad \text{solo si } |r| < 1 \]</div>
<p>Si \(|r| \ge 1\), la serie diverge. La forma más fácil de recordarlo: <span class="rule">suma = primer término ÷ (1 − razón)</span></p>
<h3>Juega con la serie</h3>
<p>Mueve \(a\) y \(r\). Cuando \(|r| < 1\), las sumas parciales se pegan a la línea punteada. Cuando \(|r| \ge 1\), se escapan.</p>
${GEO_HTML}
<h3>Ejemplos resueltos</h3>
<div class="example"><span class="tag">1 · Directo</span>
<p>\(3 + 1 + \tfrac13 + \tfrac19 + \cdots\) tiene primer término 3 y \(r = \tfrac13\):</p>\[ S = \frac{3}{1 - \frac13} = \frac{3}{\frac23} = \frac92 \]</div>
<div class="example"><span class="tag">2 · Con signo alternado</span>
<p>\(5 - \tfrac52 + \tfrac54 - \cdots\) tiene \(r = -\tfrac12\):</p>\[ S = \frac{5}{1 + \frac12} = \frac{10}{3} \]</div>
<div class="example"><span class="tag">3 · Cuidado con dónde empieza</span>
<p>\(\sum_{n=1}^{\infty} \left(\tfrac23\right)^n\) empieza en \(n = 1\), así que el primer término es \(\tfrac23\), no 1:</p>\[ S = \frac{\frac23}{1 - \frac23} = 2 \]</div>
<div class="example"><span class="tag">4 · Reescribe antes de usar la fórmula</span>
\[ \sum_{n=0}^{\infty} \frac{3^{n+1}}{5^n} = \sum_{n=0}^{\infty} 3\left(\tfrac35\right)^n = \frac{3}{1 - \frac35} = \frac{15}{2} \]</div>
<div class="example"><span class="tag">5 · Decimales periódicos</span>
\[ 0.2727\ldots = \frac{27}{100} + \frac{27}{100^2} + \cdots = \frac{\frac{27}{100}}{1 - \frac{1}{100}} = \frac{27}{99} = \frac{3}{11} \]
<p>Con la misma idea, \(0.999\ldots = \dfrac{\frac{9}{10}}{1 - \frac{1}{10}} = 1\) exacto.</p></div>
<div class="example"><span class="tag">6 · Suma finita</span>
<p>\(3 + 6 + 12 + \cdots + 384\) son 8 términos con \(r = 2\) (porque \(384 = 3 \cdot 2^7\)):</p>\[ S_8 = \frac{3\,(1 - 2^8)}{1 - 2} = 3 \cdot 255 = 765 \]</div>`,
  quiz: [
    { id: "q5a", type: "num", q: R`\(\displaystyle \sum_{n=0}^{\infty} 4\left(\tfrac13\right)^n\)`, answer: 6, display: "6",
      explain: R`\(\dfrac{4}{1 - \frac13} = \dfrac{4}{\frac23} = 6\).` },
    { id: "q5b", type: "num", q: R`\(\displaystyle \sum_{n=1}^{\infty} \left(\tfrac23\right)^n\)`, answer: 2, display: "2",
      explain: R`Empieza en \(n = 1\): primer término \(\tfrac23\). \(\dfrac{\frac23}{1 - \frac23} = 2\).` },
    { id: "q5c", type: "num", q: R`\(\displaystyle \sum_{n=1}^{\infty} \left(-\tfrac14\right)^n\)`, answer: -0.2, display: "-1/5",
      explain: R`Primer término \(-\tfrac14\), \(r = -\tfrac14\): \(\dfrac{-\frac14}{1 + \frac14} = -\dfrac15\).` },
    { id: "q5d", type: "mc", q: R`¿Cuánto da \(\displaystyle \sum_{n=0}^{\infty} \left(\tfrac54\right)^n\)?`,
      options: ["4", "−4", "Diverge", R`\(\tfrac54\)`], answer: 2,
      explain: R`\(r = \tfrac54 > 1\), así que diverge. Si usas la fórmula a ciegas sale \(-4\), pero la fórmula solo vale cuando \(|r| < 1\).` },
    { id: "q5e", type: "num", q: R`Escribe \(0.454545\ldots\) como fracción.`, answer: 5/11, display: "5/11",
      explain: R`\(\dfrac{\frac{45}{100}}{1 - \frac{1}{100}} = \dfrac{45}{99} = \dfrac{5}{11}\).` },
    { id: "q5f", type: "num", q: R`\(\displaystyle \sum_{n=0}^{\infty} \frac{3^{n+1}}{5^n}\)`, answer: 7.5, display: "15/2",
      explain: R`Es \(3\left(\tfrac35\right)^n\): \(\dfrac{3}{1 - \frac35} = \dfrac{15}{2}\).` }
  ],
  problems: [
    { id: "p5a", q: R`Calcula \(\displaystyle \sum_{n=1}^{\infty} \frac{2^n}{3^{n+1}}\).`, answer: 2/3, display: "2/3",
      hint: R`Escribe el primer término (con \(n = 1\)) y encuentra la razón dividiendo el segundo entre el primero.`,
      solution: R`<ol><li>Primer término: \(\dfrac{2}{9}\). Segundo: \(\dfrac{4}{27}\).</li><li>\(r = \dfrac{4/27}{2/9} = \dfrac23\).</li><li>\(S = \dfrac{\frac29}{1 - \frac23} = \dfrac{\frac29}{\frac13} = \dfrac23\).</li></ol>` },
    { id: "p5b", q: R`Sueltas una pelota desde 10 m. Cada rebote sube \(\tfrac35\) de la altura anterior. ¿Cuántos metros recorre en total (subiendo y bajando)?`, answer: 40, display: "40",
      hint: R`La primera caída es de 10 m. Después, cada rebote sube y baja la misma altura: \(6, 3.6, 2.16, \dots\)`,
      solution: R`<ol><li>Caída inicial: 10 m.</li><li>Rebotes: \(2\,(6 + 3.6 + 2.16 + \cdots)\), una geométrica con primer término 6 y \(r = \tfrac35\).</li><li>\(6 + 3.6 + \cdots = \dfrac{6}{1 - \frac35} = 15\).</li><li>Total: \(10 + 2 \cdot 15 = 40\) m.</li></ol>` },
    { id: "p5c", q: R`Una serie geométrica tiene primer término 3 y su suma es 12. ¿Cuánto vale \(r\)?`, answer: 0.75, display: "3/4",
      hint: R`Plantea \(\dfrac{3}{1 - r} = 12\) y despeja.`,
      solution: R`<ol><li>\(\dfrac{3}{1 - r} = 12\)</li><li>\(1 - r = \dfrac{3}{12} = \dfrac14\)</li><li>\(r = \dfrac34\). Cumple \(|r| < 1\), así que sí converge.</li></ol>` },
    { id: "p5d", q: R`Calcula la suma finita \(1 + 2 + 4 + 8 + \cdots + 512\).`, answer: 1023, display: "1023",
      hint: R`\(512 = 2^9\). ¿Cuántos términos hay si empiezas en \(2^0\)?`,
      solution: R`<ol><li>Son los términos \(2^0, 2^1, \dots, 2^9\): 10 términos.</li><li>\(S_{10} = \dfrac{1\,(1 - 2^{10})}{1 - 2} = 2^{10} - 1 = 1023\).</li></ol>` }
  ]
},
{
  short: "¿Converge?",
  title: "¿Converge o diverge?",
  goal: "Decidir si una serie converge con las herramientas básicas, sin calcular su suma.",
  lesson: R`
<p>Casi nunca se puede calcular la suma exacta de una serie. Lo que sí se puede es saber si converge. Estas son las herramientas básicas, en el orden en que conviene probarlas.</p>
<h3>1. Criterio del término n-ésimo</h3>
<div class="formula">\[ \text{Si } \lim_{n\to\infty} a_n \ne 0, \text{ entonces } \sum a_n \text{ diverge.} \]</div>
<p>Si los términos no se hacen chiquitos, sumarlos para siempre no puede dar un número. Ejemplo: \(\sum \frac{n}{n+1}\) diverge porque sus términos se acercan a 1.</p>
<p class="tip">Si el término sí tiende a 0, este criterio no dice nada. Hay que usar otro.</p>
<h3>2. La serie armónica diverge</h3>
<p>\(\sum \frac1n = 1 + \frac12 + \frac13 + \cdots\) tiene términos que van a 0 y aun así diverge. Agrupando se ve por qué:</p>
<div class="formula">\[ 1 + \frac12 + \underbrace{\frac13 + \frac14}_{>\,\frac12} + \underbrace{\frac15 + \cdots + \frac18}_{>\,\frac12} + \underbrace{\frac19 + \cdots + \frac1{16}}_{>\,\frac12} + \cdots \]</div>
<p>Estás sumando más de \(\frac12\) infinitas veces, así que crece sin límite (aunque muy despacio).</p>
<h3>3. Serie p</h3>
<div class="formula">\[ \sum_{n=1}^{\infty} \frac{1}{n^p} \quad \text{converge si } p > 1 \text{ y diverge si } p \le 1 \]</div>
<p>\(\sum \frac{1}{n^2}\) converge. \(\sum \frac{1}{\sqrt n}\) diverge, porque \(p = \frac12\). La armónica es el caso \(p = 1\).</p>
<h3>4. Comparación</h3>
<p>Si \(0 \le a_n \le b_n\) y \(\sum b_n\) converge, entonces \(\sum a_n\) también converge, porque es más chica. Al revés, si \(a_n \ge b_n \ge 0\) y \(\sum b_n\) diverge, \(\sum a_n\) también diverge.</p>
<p>Ejemplo: \(\dfrac{1}{2^n + 1} < \dfrac{1}{2^n}\), y \(\sum \dfrac{1}{2^n}\) es geométrica con \(r = \frac12\). Entonces \(\sum \dfrac{1}{2^n + 1}\) converge.</p>
<h3>5. Criterio de la razón</h3>
<div class="formula">\[ L = \lim_{n\to\infty} \left| \frac{a_{n+1}}{a_n} \right| \qquad L < 1 \text{ converge},\quad L > 1 \text{ diverge},\quad L = 1 \text{ no decide} \]</div>
<p>Es el mejor cuando hay factoriales o potencias como \(2^n\). Para \(\sum \dfrac{2^n}{n!}\):</p>
<div class="formula">\[ \frac{a_{n+1}}{a_n} = \frac{2^{n+1}}{(n+1)!} \cdot \frac{n!}{2^n} = \frac{2}{n+1} \to 0 < 1 \quad\Longrightarrow\quad \text{converge} \]</div>
<h3>Qué probar según lo que veas</h3>
<div class="tbl"><table>
<thead><tr><th>Si ves…</th><th>Prueba primero</th></tr></thead>
<tbody>
<tr><td>Términos que no van a 0</td><td>Término n-ésimo: diverge</td></tr>
<tr><td>\(a\,r^n\)</td><td>Geométrica: converge si \(|r| < 1\)</td></tr>
<tr><td>\(\dfrac{1}{n^p}\)</td><td>Serie p</td></tr>
<tr><td>Algo parecido a \(\dfrac{1}{n^p}\) o a una geométrica</td><td>Comparación</td></tr>
<tr><td>Factoriales o potencias \(c^n\)</td><td>Razón</td></tr>
<tr><td>Fracciones que se pueden partir en una resta</td><td>Telescópica</td></tr>
</tbody></table></div>`,

      options: ["Converge", "Diverge: sus términos no van a 0", "Diverge: es una serie p con p = 1", "No se puede saber"], answer: 1,

const N = LEVELS.length;

const fresh = () => ({ q: {}, passed: {}, solved: {}, open: {}, last: 0 });

  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") return Object.assign(fresh(), s); } catch (e) {}
  return fresh();
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const need = (lv) => Math.ceil(lv.quiz.length * 0.8);
const unlocked = (i) => i === 0 || !!S.passed[i - 1] || !!S.open[i];
let current = 0;

function typeset(el) {
  if (!el || !window.__mjReady || !window.MathJax || !MathJax.typesetPromise) return;
  try { MathJax.typesetClear([el]); } catch (e) {}
  MathJax.typesetPromise([el]).catch(function () {});
}

function parseNum(raw) {
  let s = String(raw).trim().replace(/\s+/g, "").replace(/−/g, "-").replace(/^\+/, "");
  if (!s) return null;
  if (/^-?\d+,\d+$/.test(s)) s = s.replace(",", ".");
  let m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) { const d = parseFloat(m[2]); if (d === 0) return null; return parseFloat(m[1]) / d; }
  if (/^-?\d*\.?\d+$/.test(s)) return parseFloat(s);
  return null;
}
function grade(x, ans) {
  const scale = Math.max(1, Math.abs(ans)), diff = Math.abs(x - ans);
  if (diff <= 2e-3 * scale) return "ok";
  if (diff <= 2e-2 * scale) return "near";
  return "bad";
}
function fmt(v) {
  if (!isFinite(v)) return "∞";
  if (Math.abs(v) >= 1e5) return v.toExponential(2);
  return (+v.toFixed(4)).toLocaleString("es-MX", { maximumFractionDigits: 4 });
}

function levelStats(i) {
  const lv = LEVELS[i];
  let first = 0, done = 0;
  lv.quiz.forEach((q) => { const st = S.q[q.id]; if (st && st.first === true) first++; if (st && st.done) done++; });
  return { n: lv.quiz.length, first, done, need: need(lv) };
}

  const passedCount = LEVELS.filter((_, i) => S.passed[i]).length;
  document.getElementById("segs").innerHTML = LEVELS.map((_, i) => `<span class="${S.passed[i] ? "on" : ""}"></span>`).join("");
  document.getElementById("prog-text").textContent = `${passedCount} de ${N} niveles aprobados`;
  document.getElementById("rail").innerHTML = LEVELS.map((lv, i) => {
    const state = S.passed[i] ? "passed" : unlocked(i) ? "avail" : "locked";
    const label = S.passed[i] ? "Aprobado" : unlocked(i) ? "Disponible" : "Bloqueado";
    return `<li><button class="lvl ${state}" data-go="${i}" ${i === current ? 'aria-current="page"' : ""}><span class="num">${S.passed[i] ? "✓" : i + 1}</span><span><span class="name">${lv.short}</span><small>${label}</small></span></button></li>`;
  }).join("");

function qHTML(q, k) {
  const st = S.q[q.id] || {};

  let input;
  if (q.type === "mc") {
    input = `<div class="opts" role="radiogroup" aria-label="Opciones de la pregunta ${k + 1}">${q.options.map((o, j) =>
      `<label class="opt${done && j === q.answer ? " correct" : ""}"><input type="radio" name="${q.id}" value="${j}" ${done ? "disabled" : ""} ${done && j === q.answer ? "checked" : ""}><span>${o}</span></label>`).join("")}</div>`;
  } else {
    input = `<div class="row"><input type="text" id="in-${q.id}" autocomplete="off" spellcheck="false" placeholder="Ej. 3/4" aria-label="Respuesta de la pregunta ${k + 1}" ${done ? `value="${q.display}" disabled` : ""}></div>`;
  }
  return `<div class="q${done ? " done" : ""}" id="q-${q.id}" data-k="${k}">
    <div class="q-top"><span class="tag">Pregunta ${k + 1}</span>${pill}</div>

    <p class="err" id="err-${q.id}" hidden></p>
    <div class="fb" id="fb-${q.id}">${done ? '<p class="ok-msg">Correcto.</p>' : ""}</div>

}

  return "";
}

function checkQuestion(id) {
  const i = current, lv = LEVELS[i];
  const k = lv.quiz.findIndex((q) => q.id === id);
  const q = lv.quiz[k];
  const err = document.getElementById("err-" + id), fb = document.getElementById("fb-" + id);
  let correct;
  if (q.type === "mc") {
    const sel = document.querySelector(`input[name="${id}"]:checked`);
    if (!sel) { err.textContent = "Elige una opción primero."; err.hidden = false; return; }
    correct = +sel.value === q.answer;
  } else {
    const val = document.getElementById("in-" + id).value;
    if (!val.trim()) { err.textContent = "Escribe una respuesta primero."; err.hidden = false; return; }
    const x = parseNum(val);
    if (x === null) { err.textContent = "No entendí ese número. Escribe un entero, un decimal o una fracción como 3/4."; err.hidden = false; return; }
    const g = grade(x, q.answer);
    if (g === "near") { err.hidden = true; fb.innerHTML = '<p class="near-msg">Muy cerca. Escribe la fracción exacta o más decimales.</p>'; return; }
    correct = g === "ok";
  }
  err.hidden = true;
  const st = S.q[id] || (S.q[id] = {});
  if (st.first === undefined) st.first = correct;
  if (correct) {
    st.done = true;
    const s = levelStats(i);
    if (s.done === s.n && s.first >= s.need) S.passed[i] = true;
    save();
    const el = document.getElementById("q-" + id);
    el.outerHTML = qHTML(q, k);
    typeset(document.getElementById("q-" + id));
    refreshQuizMeta(i);
    renderChrome();
  } else {
    save();
    fb.innerHTML = `<p class="bad-msg">No es correcto. Inténtalo otra vez.</p><div class="row" style="margin-top:6px"><button class="btn quiet" data-act="explain" data-id="${id}">Ver explicación</button></div>`;
    const top = document.querySelector(`#q-${id} .q-top`);
    if (top && !top.querySelector(".pill")) top.insertAdjacentHTML("beforeend", '<span class="pill bad">Falló al primer intento</span>');
    refreshQuizMeta(i);
  }
}

function checkProblem(id) {
  const p = LEVELS[current].problems.find((x) => x.id === id);
  const err = document.getElementById("err-" + id), fb = document.getElementById("fb-" + id);
  const val = document.getElementById("in-" + id).value;
  if (!val.trim()) { err.textContent = "Escribe una respuesta primero."; err.hidden = false; return; }
  const x = parseNum(val);
  if (x === null) { err.textContent = "No entendí ese número. Escribe un entero, un decimal o una fracción como 3/4."; err.hidden = false; return; }
  err.hidden = true;
  const g = grade(x, p.answer);
  if (g === "ok") {
    fb.innerHTML = '<p class="ok-msg">Correcto. Revisa la solución para comparar tu procedimiento.</p>';
    if (!S.solved[id]) {
      S.solved[id] = true; save();
      const top = document.querySelector(`#p-${id} .q-top`);
      if (top) top.insertAdjacentHTML("beforeend", '<span class="pill ok">Resuelto</span>');
      document.getElementById("p-" + id).classList.add("done");
    }
  } else if (g === "near") {
    fb.innerHTML = '<p class="near-msg">Muy cerca. Escribe la fracción exacta o más decimales.</p>';
  } else {
    fb.innerHTML = '<p class="bad-msg">Todavía no. Pide una pista o revisa tu procedimiento.</p>';
  }
}

function reveal(elId) { const el = document.getElementById(elId); if (el) { el.hidden = false; typeset(el); } }

function go(i) {
  if (i < 0 || i >= N) return;
  const h = "nivel-" + (i + 1);
  if (location.hash.slice(1) === h) { route(); } else { location.hash = h; }
}

function route() {
  const m = location.hash.match(/^#nivel-(\d+)$/);
  let i = m ? +m[1] - 1 : S.last || 0;
  if (!(i >= 0 && i < N)) i = 0;
  current = i; S.last = i; save();
  renderChrome();
  renderLevel(i);
}

document.addEventListener("click", function (e) {
  const goBtn = e.target.closest("[data-go]");
  if (goBtn) {
    go(+goBtn.dataset.go);
    const m = document.getElementById("main");
    if (m) m.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  if (e.target.id === "wipe") { wipeArmed = true; renderChrome(); return; }
  if (e.target.id === "wipe-no") { wipeArmed = false; renderChrome(); return; }
  if (e.target.id === "wipe-yes") { wipeArmed = false; S = fresh(); save(); current = 0; go(0); renderChrome(); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "check") checkQuestion(id);
  else if (act === "pcheck") checkProblem(id);
  else if (act === "explain") { reveal("ex-" + id); b.remove(); }
  else if (act === "hint") reveal("hint-" + id);
  else if (act === "sol") reveal("sol-" + id);
  else if (act === "open") { S.open[+b.dataset.lvl] = true; save(); route(); }
  else if (act === "reset") {
    const i = +b.dataset.lvl;
    LEVELS[i].quiz.forEach((q) => delete S.q[q.id]);
    save(); renderLevel(i); renderChrome();
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" || !e.target.matches('input[type="text"]')) return;
  const card = e.target.closest(".q");
  const btn = card && card.querySelector('[data-act="check"], [data-act="pcheck"]');
  if (btn) { e.preventDefault(); btn.click(); }
});
document.addEventListener("input", function (e) {
  const card = e.target.closest && e.target.closest(".q");
  if (card) { const err = card.querySelector(".err"); if (err) err.hidden = true; }
});
document.addEventListener("change", function (e) {
  if (e.target.matches('input[type="radio"]')) { const card = e.target.closest(".q"); const err = card && card.querySelector(".err"); if (err) err.hidden = true; }
});
window.addEventListener("hashchange", route);

function drawZeno() {
  const svg = document.getElementById("zeno");
  const NS = "http://www.w3.org/2000/svg";
  let x = 0, y = 0, w = 240, h = 240, out = "";
  const labels = ["1/2", "1/4", "1/8", "1/16", "1/32"];
  for (let i = 0; i < 10; i++) {
    let rx, ry, rw, rh;
    if (i % 2 === 0) { rx = x; ry = y; rw = w / 2; rh = h; x += w / 2; w /= 2; }
    else { rx = x; ry = y; rw = w; rh = h / 2; y += h / 2; h /= 2; }
    const op = Math.max(0.16, 0.9 - i * 0.085);
    out += `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" style="fill:var(--accent);fill-opacity:${op};stroke:var(--card);stroke-width:1.5"></rect>`;
    if (i < labels.length) {
      const fs = Math.min(22, Math.min(rw, rh) * 0.3);
      out += `<text x="${rx + rw / 2}" y="${ry + rh / 2}" text-anchor="middle" dominant-baseline="central" style="fill:var(--accent-ink);font:600 ${fs}px var(--f-mono)">${labels[i]}</text>`;
    }
  }
  svg.innerHTML = out;
}

function initGeo() {
  const a = document.getElementById("geo-a"), r = document.getElementById("geo-r");
  const draw = () => drawGeo(+a.value, +r.value);
  a.addEventListener("input", draw); r.addEventListener("input", draw);
  draw();
}

function drawGeo(a, r) {
  document.getElementById("geo-a-out").textContent = fmt(a);
  document.getElementById("geo-r-out").textContent = fmt(r);
  const Nn = 15, terms = [], sums = [];
  let s = 0;
  for (let k = 0; k < Nn; k++) { const t = a * Math.pow(r, k); s += t; terms.push(t); sums.push(s); }
  const conv = Math.abs(r) < 1;
  const lim = conv ? a / (1 - r) : null;
  const res = document.getElementById("geo-result");
  if (a === 0) res.innerHTML = "Con a = 0 todos los términos valen 0 y la suma es 0.";
  else if (conv) res.innerHTML = `Como |r| &lt; 1, <b>converge</b>: suma = ${fmt(a)} ÷ (1 − ${fmt(r)}) = <b>${fmt(lim)}</b>. Después de 15 términos ya vas en S₁₅ = ${fmt(s)}.`;
  else if (r === 1) res.innerHTML = `Con r = 1 sumas ${fmt(a)} una y otra vez, así que <b>diverge</b>. S₁₅ = ${fmt(s)} y sigue creciendo.`;
  else if (r === -1) res.innerHTML = `Con r = −1 las sumas parciales saltan entre ${fmt(a)} y 0 para siempre, así que <b>diverge</b>.`;
  else res.innerHTML = `Como |r| ≥ 1, <b>diverge</b>: las sumas parciales no se acercan a ningún número. S₁₅ = ${fmt(s)}.`;

  const L = 54, Rt = 628, T = 14, B = 222;
  const vals = terms.concat(sums, [0]); if (lim !== null) vals.push(lim);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = (k) => L + (k + 0.5) * (Rt - L) / Nn;
  const Y = (v) => B - (v - lo) / (hi - lo) * (B - T);
  let out = "";
  for (let t = 0; t <= 4; t++) {
    const v = lo + (hi - lo) * t / 4, y = Y(v);
    out += `<line class="g-axis" x1="${L}" x2="${Rt}" y1="${y}" y2="${y}"></line><text class="g-txt" x="${L - 6}" y="${y}" text-anchor="end" dominant-baseline="central">${fmt(+v.toPrecision(3))}</text>`;
  }
  out += `<line class="g-zero" x1="${L}" x2="${Rt}" y1="${Y(0)}" y2="${Y(0)}"></line>`;
  const bw = (Rt - L) / Nn * 0.5;
  terms.forEach((t, k) => { const y0 = Y(0), y1 = Y(t); out += `<rect class="g-bar" x="${X(k) - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="2"></rect>`; });
  if (lim !== null) out += `<line class="g-lim" x1="${L}" x2="${Rt}" y1="${Y(lim)}" y2="${Y(lim)}"></line>`;
  out += `<polyline class="g-sum" points="${sums.map((v, k) => `${X(k)},${Y(v)}`).join(" ")}"></polyline>`;
  sums.forEach((v, k) => { out += `<circle class="g-dot" cx="${X(k)}" cy="${Y(v)}" r="4"></circle>`; });
  [0, 4, 9, 14].forEach((k) => { out += `<text class="g-txt" x="${X(k)}" y="${B + 16}" text-anchor="middle">n = ${k}</text>`; });
  document.getElementById("geo-svg").innerHTML = out;
}

route();
</script>
